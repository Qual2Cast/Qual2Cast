project:
  type: book
  output-dir: _site
  # After every render: _site/facts.csv, every named fact in one file for the slide makers (site/README.md).
  post-render:
    - scripts/write_facts.py

book:
  title: "Qual2Cast"
  author: "Qual2Cast team"
  repo-url: https://github.com/Qual2Cast/Qual2Cast
  repo-subdir: site
  repo-branch: main
  chapters:
    - index.qmd
    - data.qmd
    - describing.qmd
    - finding.qmd
    - judging.qmd
    - results.qmd
    - limits.qmd
  appendices:
    - glossary.qmd
    - team.qmd
    - reproduce.qmd

execute:
  echo: false
  warning: false
  message: false

format:
  html:
    theme: cosmo
    css: styles.css
