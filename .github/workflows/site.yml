# The project website (site/): check it, render it with Quarto, and publish it on GitHub Pages
# (qual2cast.github.io/Qual2Cast). See site/README.md, "Build and deploy".
#
#   push to main         check, render, deploy
#   pull request         check and render only (a broken page or a changed pin shows up before it merges)
#   run by hand          check and render; deploys only when run on main
#
# Pages must be enabled once by a repository admin: Settings > Pages > Source: GitHub Actions.

name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "outputs-local/**"
      - "v2/current.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "outputs-local/**"
      - "v2/current.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer push to the same branch or pull request replaces a build still running.
    concurrency:
      group: site-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Quarto runs the chapters' Python cells and the post-render script (site/scripts/write_facts.py) with the
      # light environment that `uv sync --only-group site` makes in .venv.
      QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no major-version tags (since v8), so it is pinned to a full release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install the site environment (the light `site` group plus pytest, no torch)
        run: uv sync --locked --only-group site --only-group dev

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.37

      - name: Check pins, placeholders and typed numbers
        run: uv run --no-sync python site/scripts/check.py

      - name: Test the checks and every chapter's facts
        run: uv run --no-sync pytest site/tests -q

      - name: Render the site
        run: uv run --no-sync quarto render site

      - name: Upload the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a deployment in progress is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
