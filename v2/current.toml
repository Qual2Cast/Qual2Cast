# What v2 treats as current (copied from v1a/current.toml on 2026-11-24, plus the v2 sections at the end).
# Most runs named here are still in outputs-local/v1a/: v2 reads them in place (common/paths.py).
# Every component notebook reads this file, so the
# components cannot drift apart. Change a line here (with a dated note in the
# component's changelog) instead of hard-coding a run in a notebook or script.
# Paths are relative to the repository root.

[universe]
snapshot = "company_list_v3"                     # data_manifest.json
universe_run = "20261025T060358Z"                # 533 eligible companies
split_run = "20261027T204930Z"                   # 373 training / 160 holdout, SIC2-stratified
universe = "outputs-local/v1a/01_universe/universe/universe.csv"
split = "outputs-local/v1a/01_universe/split/split.csv"

[profiles]
general = "outputs-local/v1a/02_profiles/facets_sonnet/tables/facets.csv"   # Sonnet 5.5 fills
general_prompt_version = "2026-10-25k"
sector = "outputs-local/v1a/02_profiles/sector_facets_sonnet/tables/sector_facets.csv"  # Fiona; sub-sector used by B3
industry = "outputs-local/v1a/02_profiles/industry_facets_sonnet/tables/industry_facets_long.csv"  # Barbara SIC2; not in B3
corrected_general = "outputs-local/v1a/02_profiles/facets_sonnet_corrected.csv"  # Yiming divestiture corrections (42 cos.); kept, not the default
website_pages = "outputs-local/website_scrape/page_text"

[retrieval]
method = "B3"
variant = "Sonnet + Fiona sub-sector"
rule = "mutual top 10, topped up to 3"
excluded_facets = ["company_size"]
candidates = "outputs-local/v1a/03_retrieval/selector_candidates"

[selection]
route = "cosine_then_llm"
model = "claude-sonnet-5-5"
prompt_version = "2026-11-04a"
backend = "claude-cli"                           # Claude subscription through the Claude Code CLI, no API key
candidates = "outputs-local/v1a/03_retrieval/selector_candidates"   # the current B3 list it screened
judgments = "outputs-local/v1a/04_selection/b3_selector_candidates_2026-11-04a_claude-cli_claude-sonnet-5-5/tables/judgments.csv"
# v1 history (seeded, not current): cosine_then_llm_{sonnet,haiku}/ and direct_llm_{sonnet,haiku}/ screened the
# 11-04 B3 list built from Haiku facets

[agent_grading]
run = "outputs-local/v1a/05_agent_grading/ranking_45targets_sonnet"
model = "sonnet"
prompt_version = "2026-11-05b"
facet_scores = true
# the 30 extra B3 pairs on the rubric v3 sheet (22 targets), graded separately with the same prompt, model and
# settings; no pair overlaps `run`. progress.py's agent profiles stack them (team, 2026-11-27).
extra_verdicts = ["outputs-local/v1a/05_agent_grading/b3_kept_30/agent/verdicts.csv"]

[judges]
# LLM-as-judge (evaluation only; never chooses comps). GPT family, so the model line is clear: Claude selects, GPT judges.
model = "gpt-5.6-terra"                          # GPT-Terra for new judge runs (Michael, 2026-11-19); the saved 293 run is GPT-6.1 Sol
backend = "codex"

[labels]
default_cohort = "dev_293"
cohorts = ["dev_293", "round1_36", "matthew_v2_262", "matthew_v3_311", "barbara_v3_311", "v3_agreed", "v3_final"]
locked_cohorts = ["final_holdout_24"]            # load only from 10_final_holdout

[valuation]
financials = "outputs-local/v1a/08_valuation/financials.csv"   # EV/EBITDA; read only by 08 and 10, never by 01-07
estimate = "median EV/EBITDA of the selected peers"

[analysis.facet_uplift]
# 09: X-learner facet-lift runs (09_analysis/scripts/facet_uplift.py), pinned 2026-11-19. Read by analysis.ipynb.
human_peer = "outputs-local/v1a/09_analysis/facet_uplift/20261119T031027158914Z"       # dev_293, grade>=1, current B3 signals; + 05 agent-grade stage (was 20261119T021242064364Z)
human_rating = "outputs-local/v1a/09_analysis/facet_uplift/20261119T031040215833Z"     # dev_293, 0/1/2 grade; + 05 agent-grade stage (was 20261119T021253830100Z)
selector_all = "outputs-local/v1a/09_analysis/facet_uplift/20261119T021304002727Z"     # all 2,538 B3 pairs, selector keep
selector_293 = "outputs-local/v1a/09_analysis/facet_uplift/20261119T021318755980Z"     # dev_293 pairs, selector keep
record_peer = "outputs-local/v1a/09_analysis/facet_uplift/20261119T021152291026Z"      # v1 features; = v1 20261113T190330202875Z
record_rating = "outputs-local/v1a/09_analysis/facet_uplift/20261119T021120275676Z"    # v1 features; = v1 20261113T201612982633Z

[outputs]
root = "outputs-local/v2"                        # new runs (was outputs-local/v1a in v1a)
v1a_record = "outputs-local/v1a"                 # existing runs, read in place
v1_record = "outputs-local/v1"                   # frozen; raw per-call files are linked from here, not copied

# ---------------------------------------------------------------- v2 (2026-11-24)
# Everything above is v1a's current setting, unchanged (copied 2026-11-24). Sections below are what v2 adds.
# Outputs of v2 runs go to outputs-local/v2/<component>/.

[traits]
# 02_profiles: tags T1-T4 and economic traits E1-E6, yes/no/unknown per company (v2/02_profiles/scripts/traits.py)
prompt_version = "2026-11-24a"
model = "claude-sonnet-5-5"
backend = "claude-cli"
test_runs = ["outputs-local/v2/02_profiles/traits_test/run1", "outputs-local/v2/02_profiles/traits_test/run2"]
table = "outputs-local/v2/02_profiles/traits_new/tables/traits.csv"   # 533/533 ok, prompt 2026-11-24a, pinned 2026-11-24

[traits_r2]
# 02_profiles: round-2 traits E7-E10 (maintenance-led, publicly funded, serial acquirer, mission-critical), asked in a
# separate call (fill_traits.py --round 2); designed after round 1's run, so its own pre-registered family
prompt_version = "2026-11-24b"
model = "claude-sonnet-5-5"
backend = "claude-cli"
test_runs = ["outputs-local/v2/02_profiles/traits_r2_test/run1", "outputs-local/v2/02_profiles/traits_r2_test/run2"]
table = "outputs-local/v2/02_profiles/traits_r2/tables/traits.csv"

[analysis.trait_uplift_r2]
# 09: round-2 trait X-learner (trait_uplift.py --round 2), pre-registered in PREREG_TRAITS_R2.md (commit b3b5e309)
prereg = "v2/09_analysis/PREREG_TRAITS_R2.md"
cohort = "matthew_v2_262"
traits_r2 = "outputs-local/v2/02_profiles/traits_r2/tables/traits.csv"
run = "outputs-local/v2/09_analysis/trait_uplift/20261124T111715563218Z_r2"   # first round-2 run, 2026-11-24

[rubric_v3]
# 06_labels: rubric v3 (v2/06_labels/RUBRIC_V3.md); blind sheet written once by rubric_v3.py build-sheet
sheet = "outputs-local/v2/06_labels/rubric_v3/rubric_v3_sheet.csv"   # 323 pairs (12 anchors, 311 scored)
reviewers = ["matthew", "barbara", "riya"]
tiebreak = "LLM judge on all 323 pairs; per outcome (direct, peer, overall call), its outcome breaks a split (2 of 3): rubric_v3.py final (team ruling 2026-11-27; replaces the per-question earned rule)"
filled = "outputs-local/v2/06_labels/rubric_v3/filled/rubric_v3_filled_matthew_barbara_20261127.csv"   # Matthew + Barbara, 323/323, received 2026-11-27
scores = "outputs-local/v2/06_labels/rubric_v3/scores/20261128T001954Z"   # rubric_v3.py scores + consensus on `filled`, no tie-break yet
judge = "outputs-local/v2/06_labels/rubric_v3/judge/terra_20261128T030942Z"   # GPT-Terra (codex, gpt-5.6-terra), all 323 pairs, prompt 2026-11-27a
final = "outputs-local/v2/06_labels/rubric_v3/final/terra_20261128T030942Z"   # headline labels: rubric_v3.py final --judge terra (cohort v3_final)

[analysis.trait_uplift]
# 09_analysis: trait X-learner (v2/09_analysis/scripts/trait_uplift.py), pre-registered before any real run
prereg = "v2/09_analysis/PREREG_TRAITS.md"
cohort = "matthew_v2_262"                        # direct peer primary, peer secondary; rerun unchanged on rubric v3 labels
traits = "outputs-local/v2/02_profiles/traits_new/tables/traits.csv"
run = "outputs-local/v2/09_analysis/trait_uplift/20261124T101142641398Z"   # first pre-registered run, Matthew v2 labels, 2026-11-24
v3_cohort = "v3_final"                           # the pre-registered rerun (PREREG_TRAITS.md amendment 2026-11-27)
v3_run = "outputs-local/v2/09_analysis/trait_uplift/20261128T042306693074Z"   # round 1 on v3_final
v3_run_r2 = "outputs-local/v2/09_analysis/trait_uplift/20261128T043127850920Z_r2"   # round 2 on v3_final
v3_run_overall = "outputs-local/v2/09_analysis/trait_uplift/20261128T043638119157Z_overall"   # overall-call cross-check family

[analysis.progress]
# 09: improvement ledger (v2/09_analysis/scripts/progress.py, PROGRESS.md); append-only, one row per pipeline change
ledger = "outputs-local/v2/09_analysis/progress/ledger.csv"
cohort = "v3_final"                              # from 2026-11-27 (rubric v3 headline labels); earlier rows: matthew_v2_262
