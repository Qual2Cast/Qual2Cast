# Change model/effort here; a new configuration gets a separate output folder.
provider = "codex"
split_file = "outputs-local/v1a/01_universe/split/split.csv"   # = v1 split 20261027T204930Z
targets = "training" # v1a: training only (the holdout is the locked final check)
target_tickers = [] # empty means every target in the selected split
workers = 2
evidence_words = 1500
passing_score = 3 # reporting only; judge scores never select peers

[fill]
model = "gpt-6.1-sol"
effort = "high"

[filter]
model = "gpt-6.1-sol"
effort = "medium"

[judge]
model = "gpt-6-luna"
effort = "medium"
