function fieldHTML(f,p=state.profile){const filled=f.evidence_ids?.length;return `<article class="card"><h3>${f.general_meta?`<span class="badge">${esc(f.general_meta.id)}</span> <span class="badge">${esc(f.general_meta.priority)}</span> `:''}${esc(f.name)} ${f.module?`<span class="badge">${esc(f.module)}</span>`:''}</h3>${f.general_meta?`<p class="small">${esc(f.general_meta.definition)}</p>`:''}${filled?(f.evidence_ids||[]).map(id=>quoteHTML(id,p)).join(''):`<p class="small">${word('No sufficiently relevant source passage yet. This does not mean the company lacks this attribute.','尚无足够相关的来源原文，不代表公司没有该属性。')}</p>`}${(f.other_evidence_ids||[]).length?`<details><summary>${word('Additional source wording','其他来源原文')} (${f.other_evidence_ids.length})</summary>${f.other_evidence_ids.map(id=>quoteHTML(id,p)).join('')}</details>`:''}${(f.source_difference_notes||[]).length?`<p class="source-discrepancy-note">${esc(f.source_difference_notes.join(' '))}</p>`:''}<p class="small">${filled?word('Extracted evidence; entity, date, scope and meaning review remains necessary.','已提取证据；仍需核对实体、时期、范围及含义。'):''} ${f.cross_validation?.source_types?.length>1?word('Multiple source types are shown; this is not independent corroboration.','展示了多类来源，但不等于已获得独立交叉验证。'):filled?word('Independent source confirmation is not established.','尚未建立独立来源交叉确认。'):''}</p></article>`}
function companyList(){const q=$('companySearch').value.toLowerCase(),scope=$('role').value;const rows=state.companies.filter(c=>(scope!=='TARGET'||c.is_original_target)&&(scope!=='PUBLIC'||c.is_listed_registry)&&([c.name,c.id,...(c.rics||[]),...(c.name_aliases||[]),...(c.original_target_ids||[])].join(' ').toLowerCase().includes(q)));$('companyCount').textContent=rows.length+word(' companies · one shared research profile each',' 家公司 · 每家公司一份共享研究档案');$('companies').innerHTML=rows.slice(0,state.limit).map(c=>`<button class="company ${state.selected?.key===c.key?'selected':''}" data-company="${esc(c.key)}">${esc(c.name)}<small>${esc(c.rics?.slice(0,3).join(' · ')||c.id)}</small></button>`).join('');$('companies').querySelectorAll('button').forEach(b=>b.onclick=()=>choose(b.dataset.company));$('moreCompanies').hidden=rows.length<=state.limit}
function shell(){document.documentElement.lang=en()?'en':'zh';$('languageSwitch').value=state.language;$('findCompanyLabel').textContent=word('Find a company','查找公司');$('role').options[0].textContent=word('Original 560 companies','原始560家公司');$('role').options[1].textContent=word('Global public universe','全球上市公司清单');$('role').options[2].textContent=word('All research companies','所有研究公司');$('moreCompanies').textContent=word('Show 100 more','再显示100家');const labels={comps:word('Public Comps','上市可比公司'),facets:word('General facet','通用facet'),industry:word('Industry facets','行业facet'),segments:word('Business segments','业务分部'),sources:word('Evidence sources','证据来源')};document.querySelectorAll('nav button').forEach(b=>{b.textContent=labels[b.dataset.tab];b.classList.toggle('active',b.dataset.tab===state.tab)});$('researchNote').textContent=word('Every company has one full public research profile. Filtering the company list does not change its evidence. Only Public Comps uses a separate restricted input snapshot for the original 560 companies.','每家公司只有一份完整公开研究档案，左侧筛选不会改变资料。只有 Public Comps 使用原始560家公司单独的受限输入快照。');companyList()}
async function choose(key){const request=++state.request;state.selected=state.companies.find(c=>c.key===key);state.profile=null;shell();$('companyTitle').innerHTML=`<h2>${esc(state.selected.name)}</h2>`;$('content').innerHTML=`<p>${word('Loading company research…','读取公司研究资料…')}</p>`;const data=await read(state.groups[key]);if(request!==state.request)return;state.profile=data[key];if(!state.profile)throw Error('Company profile missing');render();const url=new URL(location.href);url.searchParams.set('company',state.selected.id);url.searchParams.set('view',state.tab);url.searchParams.delete('role');history.replaceState(null,'',url)}
function render(){shell();const p=state.profile;if(!p){$('content').innerHTML=`<p>${word('Select a company.','请选择公司。')}</p>`;return}$('companyTitle').innerHTML=`<h2>${esc(p.name)}</h2><p class="small">${esc(p.rics.join(' · '))}</p><div class="metrics"><span><b>${p.main_filled}/${GENERAL_FACET_SCHEMA.length}</b>${word('Main facets with evidence','有证据的通用项')}</span><span><b>${p.industry_filled}/${p.industry_facets.length}</b>${word('Industry facets with evidence','有证据的行业项')}</span><span><b>${Object.keys(p.sources).length}</b>${word('Cited source records','已引用来源记录')}</span></div>`;if(state.tab==='comps'){if(p.comparison_target_id)$('companyTitle').innerHTML=`<h2>${esc(p.name)}</h2>`;return showComps();}if(state.tab==='facets')return showFacets();if(state.tab==='industry')return showIndustry();if(state.tab==='segments')return showSegments();showSources()}
function showFacets(){const p=state.profile;const existing=new Map(p.main_facets.map(f=>[f.name,f]));const fields=GENERAL_FACET_SCHEMA.map(m=>({...existing.get(m.name),name:m.name,general_meta:m,evidence_ids:existing.get(m.name)?.evidence_ids||[]}));const unknown=p.main_facets.filter(f=>!GENERAL_FACET_SCHEMA.some(m=>m.name===f.name));$('content').innerHTML=`<h2>${word('General facet','通用facet')}</h2><p class="small">${word('P0 Essential · P1 Important refinement · P2 Supporting context · P3 Optional context. Extraction/review priority, not scoring weight.','P0 核心识别 · P1 重要细化 · P2 辅助背景 · P3 可选背景。表示提取／复核优先级，不是评分权重。')}</p><p><a href="General_Facets_Refined.md" download>${word('Download general facet dictionary (.md)','下载通用facet词典（.md）')}</a></p><p class="small">${word('Full public research. New fields remain unknown until relevant evidence is assigned; list filters do not change the evidence.','完整公开研究。新增字段在分配相关证据前保持未知；切换列表不会改变证据。')}</p>`+(p.business_description?`<details class="card"><summary>${word('Company business description','公司业务描述')}</summary><div class="value">${esc(p.business_description.text)}</div>${sourceHTML(p.sources[p.business_description.source_id])}</details>`:'')+fields.concat(unknown).map(f=>fieldHTML(f)).join('')}
function segmentEvidenceHTML(s){const fields=s.segment_facets||[],extra=s.additional_sources||[],activity=s.activity_evidence||[];if(!fields.length&&!extra.length&&!activity.length)return '';return `<details><summary>${word('Segment evidence and facets','分部证据与facet')} (${fields.filter(f=>f.text).length}/${fields.length})</summary>${activity.map(q=>`<div class="value">${esc(q.text)}</div>${sourceHTML(q.source)}`).join('')}${fields.map(f=>`<h4>${esc(f.name)}</h4><div class="value">${esc(f.text||word('UNKNOWN — no sufficiently scoped passage','未知 — 暂无足够明确的分部原文'))}</div>${f.source?sourceHTML(f.source):''}`).join('')}${extra.length?`<h4>${word('Other sources naming this segment','其他提及本分部的来源')}</h4>`+extra.map(q=>`<div class="value">${esc(q.source_excerpt)}</div>${sourceHTML(q.source)}`).join(''):''}<p class="small">${word('Automated extraction and analyst activity mapping require review. Company-wide facts are not automatically assigned to this segment.','自动提取与研究员活动映射仍需复核；不自动把公司整体事实分配给本分部。')}</p></details>`}
function segmentVersionsHTML(c){const observations=c.segment_observations||[];return `${c.segment_source_difference_note?`<p class="source-discrepancy-note">${esc(c.segment_source_difference_note)}</p>`:''}${observations.length?`<details><summary>${word('Compare segment disclosures across sources and periods','跨来源、时期比较分部披露')} (${observations.length})</summary>${observations.map(o=>`<article class="card"><strong>${esc(o.names.join(' · '))}</strong><div class="value">${esc(o.source_excerpt)}</div>${sourceHTML(o.source)}</article>`).join('')}<p class="small">${word('Identical labels alone do not establish independent corroboration. Different label sets are retained for period and scope review.','名称相同本身不代表独立交叉验证；保留不同标签集合以核对时期和范围。')}</p></details>`:''}`}
function classificationHTML(c,p){
 const obs=c.classification_observations||[],primary=c.primary_sic;
 const rows=obs.map(o=>`<tr><td>${esc(o.system)}</td><td><strong>${esc(o.code||o.label)}</strong>${o.code?'<br>'+esc(o.label):''}<p class="small">${esc(o.scope)}</p></td><td>${sourceHTML(o.source)}${o.identity_basis?`<p class="small">${esc(o.identity_basis)}</p>`:''}${o.ff49?`<p class="small">${word('SIC-derived FF49 group','由SIC映射的FF49组')}: ${esc(o.ff49.ff49_id)} · ${esc(o.ff49.industry_name)} ${link(o.ff49.source_url,word('Mapping source','映射来源'))}</p>`:''}</td></tr>`).join('');
 const seg=c.segments||[];
 return `<article class="card" id="industryClassification"><h2>${word('Industry classification & business segments','行业分类与业务分部')}</h2><p><strong>${word('Primary industry','主要行业')}: ${esc(c.primary_industry)}</strong><br>${word('Primary SIC','主要SIC')}: ${primary?esc(primary.code)+' · '+esc(primary.system):word('UNKNOWN — no admitted SIC observation','未知 — 尚无可用SIC来源')}</p><p class="small">${word('Source snapshot','来源快照')}: ${esc(c.as_of)}</p>${rows?`<div class="tablewrap"><table><thead><tr><th>${word('Classification system','分类体系')}</th><th>${word('Code / industry and scope','代码／行业及范围')}</th><th>${word('Source and date','来源与日期')}</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<p>${word('Industry classification needs further source evidence.','行业分类仍需来源证据。')}</p>`}${c.source_discrepancy_note?`<p class="source-discrepancy-note">${word(c.source_discrepancy_note,'SEC与供应商的SIC代码不同，均保留；以SEC作为公司层面的主要SIC。代码不同本身不代表业务描述矛盾。')}</p>`:''}<h3>${word('How many industries?','有几个行业？')}</h3><p>${word('A primary SIC or TRBC label describes the issuer. A reportable segment can be geographic, and several segments may share one industry. Facet templates are research checklists, so their count is not the company’s industry count.','主要SIC或TRBC标签是公司层面的分类。披露分部可能按地域划分，多个分部也可能属于同一行业。Facet模板是研究清单，模板数量不等于公司行业数量。')}</p><p>${seg.length?word(`${c.reported_segment_count==null?'Identified segment labels: '+seg.length+'; exhaustive segment count not established':c.reported_segment_count+' segments in the selected disclosure'}. ${c.mapped_activity_group_count==null?'Some activity mappings remain unknown':c.mapped_activity_group_count+' distinct activity labels used below'}. These are analyst mappings, not official segment SIC assignments.`,`${c.reported_segment_count==null?'已识别'+seg.length+'个分部标签；尚未确定完整分部总数':'所选披露明确列出'+c.reported_segment_count+'个分部'}。${c.mapped_activity_group_count==null?'部分业务活动映射仍未知':'下方使用'+c.mapped_activity_group_count+'类活动标签'}；属于研究员映射，不是官方分部SIC。`):word('Exhaustive industry count: UNKNOWN. Segment-to-industry mappings remain to be reviewed; missing mappings are not treated as a single industry.','完整行业数量：未知。分部—行业映射仍待复核，不把缺失映射视为只有一个行业。')}</p>${seg.length?`<h3>${word('Segment → industry / activity mapping','分部 → 行业／活动映射')}</h3><div class="tablewrap"><table><thead><tr><th>${word('Disclosed segment','披露分部')}</th><th>${word('Mapped industry / activity','映射的行业／活动')}</th><th>${word('Reason and source','依据与来源')}</th></tr></thead><tbody>${seg.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.industry)}<p class="small">${esc(s.mapping_type)}<br>${word('Segment SIC: not assigned','分部SIC：未指定')}</p></td><td>${esc(s.reason)}${sourceHTML(s.source)}${segmentEvidenceHTML(s)}</td></tr>`).join('')}</tbody></table></div>${seg[0].source_excerpt?`<details><summary>${word('Segment-disclosure source wording','分部披露来源原文')}</summary><div class="value">${esc(seg[0].source_excerpt)}</div>${sourceHTML(seg[0].source)}</details>`:''}`:`<p class="small">${word('Available segment-disclosure excerpts are shown below; a passage count is not a segment count.','下方展示已收集的分部披露原文；原文条数不等于分部数量。')}</p>`}${segmentVersionsHTML(c)}<details><summary>${word('Earlier template routing — retained for provenance','原有模板选择——仅保留溯源')} (${c.facet_template_count})</summary><p>${esc(c.selected_facet_templates.join(' · ')||'UNKNOWN')}</p><p>${word(c.template_selection_method,'优先把LSEG TRBC标签按规则映射到通用行业模板。没有适用规则时，使用业务描述中的关键词次数，最多取两个模板；第二名的次数须达到第一名的一半。公司自身的软件业务可触发软件模板；餐饮公司的房地产分部文字可增加物业模板。这些启发式模板不是已经核实的完整行业清单。')}</p><p class="small">${word('Company-specific basis','本公司选择依据')}: ${esc(c.template_selection_basis)}</p>${c.business_description_source?.url?sourceHTML(c.business_description_source):''}<p class="small">${word('The “Real Estate / REIT” checklist does not establish REIT legal or tax status. Segment revenue shares and industry weights are not inferred.','“Real Estate / REIT”模板不代表公司具有REIT法律或税务身份；不推算分部收入占比或行业权重。')}</p></details><p class="small">${word('Full-research classifications are excluded from the simulated private-target comparison.','完整研究的分类信息不进入模拟私人目标匹配。')}</p></article>`;
}
async function classificationFor(p){const number=Math.floor(Number(state.groups[p.key].split('_').pop())/5);const block=await read('classification/group_'+String(number).padStart(3,'0'));return block[p.key]}

function showWendySegmentFields(){const pilot=state.profile.audited_wendy_segment_profile;$('content').innerHTML=`<h2>${word('Wendy’s segment-specific industry facets','Wendy’s分部专属行业facet')}</h2><p class="small">${word('Full public research; SEC segment facts here are excluded from pseudo-private target matching.','完整公开研究；这里的SEC分部资料不进入模拟私人目标匹配。')}</p>`+pilot.facets.map(f=>`<article class="card"><h3>${esc(f['Segment Name'])} · ${esc(f.Facet)}</h3><p class="small">${esc(f.Industry||'')}</p><div class="value">${esc(f['Value Text']==null?'UNKNOWN':(f['Verbatim Source Excerpt']||'UNKNOWN — no admitted verbatim excerpt'))}</div>${f['Value Text']!=null?sourceHTML({url:f['Excerpt Source Link'],source_type:'SEC',document_type:f['Excerpt Document'],document_date:f['Excerpt Filing Date'],report_period:f['Excerpt Fact Period'],record_locator:f['Excerpt Section']}):''}${(f['Source Claims']||[]).map(s=>`<div class="value">${esc(s.exact_quote||s.text||'')}</div>${link(s.source_url||s.url,s.document_type||'Source')}<p class="small">${esc(s.publication_or_filing_date||s.date||'UNKNOWN')} · ${esc(s.fact_period||'UNKNOWN')} · ${esc(s.section||'')}</p>`).join('')}<p class="small">${esc(en()?(f['Value Text']==null?(f['Description English']||'No sufficiently supported segment-specific claim is admitted.'):String(f['Scope Review']||'').includes('SHARED')?'Shared brand-level wording; not a separately disclosed segment statistic.':'The source document’s period and geographic scope apply.'):(f.Limitations||''))}</p></article>`).join('')}
async function showSegments(){const p=state.profile,request=state.request;$('content').innerHTML=`<p>${word('Loading segment classifications…','读取分部分类…')}</p>`;const c=await classificationFor(p);if(request!==state.request||state.tab!=='segments')return;$('content').innerHTML=(c?classificationHTML(c,p):'')+`<h2>${word('Business-segment evidence','业务分部证据')}</h2>`;if(p.audited_wendy_segment_profile){$('content').innerHTML+=`<button id="segmentFields">${word('Open segment-specific evidence and fields','打开分部专属证据和字段')}</button>`;$('segmentFields').onclick=showWendySegmentFields;return}$('content').innerHTML+=p.business_segments.length?p.business_segments.map(s=>`<article class="card">${s.evidence_ids.map(id=>quoteHTML(id)).join('')}</article>`).join(''):`<p>${word('No sufficiently supported segment disclosure is collected yet. This does not establish that the company has one segment.','尚未收集到足够支持的分部披露，不据此认定公司只有一个分部。')}</p>`}
function showSources(){const p=state.profile;$('content').innerHTML=`<h2>${word('Evidence sources','证据来源')}</h2><p class="small">${word('Source documents and dates for the full research profile. Search discovery is not independent confirmation; provider data may share upstream sources.','完整研究档案的来源及日期。搜索发现不等于独立确认，数据库可能共享上游来源。')}</p>`+(p.source_issues||[]).map(s=>`<p class="notice">${esc(s)}</p>`).join('')+Object.values(p.sources).map(s=>`<article class="card">${sourceHTML(s)}<p class="small">${esc(s.identity_basis||'Identity/scope review not independently completed.')}</p></article>`).join('')}
function score(x){return x==null?'UNKNOWN':Number(x).toFixed(1)}
function comparisonEvidence(v){if(!v?.text)return `<p>${word('No admitted evidence','无可采纳证据')}</p>`;return `<div class="value">${esc(v.text)}</div>`+(v.evidence||[]).map(s=>sourceHTML({url:s.url,source_type:s.source_type,document_type:String(s.verification||'').includes('PARAPHRASE')?'Reviewer paraphrase — not verbatim':s.document_type,document_date:s.document_date,report_period:s.report_period,record_locator:s.record_locator,retrieved_at:s.observed_at})).join('')}
function comparisonTable(rows){return `<div class="scroller"><table class="comparison-table"><thead><tr><th>Facet</th><th>${word('Target evidence — restricted inputs','目标证据—受限输入')}</th><th>${word('Public candidate evidence','公开候选证据')}</th><th>${word('Similarity','相似度')}</th><th>${word('Base weight %','基础权重%')}</th><th>${word('Weighted contribution','加权贡献')}</th><th>${word('Basis','依据')}</th></tr></thead><tbody>`+rows.map(r=>`<tr><td>${esc(r.facet)}${r.duplicate_of_main?`<p class="small">${word('No extra weight: duplicates','不重复计权：')}${esc(r.duplicate_of_main)}</p>`:''}</td><td>${comparisonEvidence(r.target)}</td><td>${comparisonEvidence(r.candidate)}</td><td>${score(r.score)}</td><td>${Number(r.weight||0).toFixed(2)}</td><td>${r.normalized_contribution==null?'—':Number(r.normalized_contribution).toFixed(2)}</td><td>${esc(r.method)}<p>${esc(r.rationale)}</p></td></tr>`).join('')+'</tbody></table></div>'}
async function showComps(){const request=state.request,key=state.selected.key,p=state.profile,tid=p.comparison_target_id;if(!tid){$('content').innerHTML=`<h2>Public Comps</h2><p>${word('This company is a public candidate. Choose one of the original 560 companies to run the simulated private-target comparison. Its complete research remains available in the other tabs.','这家公司是公开候选。选择原始560家公司之一查看模拟私人目标比较；其他tab仍展示完整研究。')}</p>`;return}$('content').innerHTML=`<p>${word('Loading restricted comparison inputs…','读取受限匹配输入…')}</p>`;if(!comparisonInputs)comparisonInputs=await read('comparison_inputs');const group=await read(COMPARISON_GROUPS[tid]);if(state.request!==request||state.selected.key!==key||state.tab!=='comps')return;const input=comparisonInputs[tid],rows=group[tid]||[],financial=input.available_financials||{},provenance=input.financial_provenance||{};$('content').innerHTML=`<h2>Public Comps · ${rows.length} ${word('candidate positions','个候选位置')}</h2><article class="card matching-boundary"><h3>This is treated as pseudo-private · ${esc(input.target_name)}</h3><p>${word('Only official website business text and the instructor-file Revenue, EBITDA and Debt are available to the target comparison. Complete research in the other tabs is not an input to this view.','目标比较只允许使用官网业务文字和老师文件中的Revenue、EBITDA、Debt。其他tab中的完整研究资料不作为这里的匹配输入。')}</p><div class="metrics">${['revenue','ebitda','debt'].map(k=>`<span><b>${financial[k]==null?'UNKNOWN':Number(financial[k]).toLocaleString('en-US',{maximumFractionDigits:3})}</b>${esc(k.toUpperCase())}</span>`).join('')}</div><p class="small">${esc(provenance.source_file||'Company_List_for_Interns.xlsx')} · ${esc(provenance.sheet||'')} · ${esc(provenance.units||'UNKNOWN')}<br>${word('Debt is derived from instructor Revenue × Debt/Revenue. Financial scale is displayed but is not scored while units/periods remain unconfirmed.','Debt由老师文件Revenue×Debt/Revenue推导。单位及报告期未确认前，财务规模仅展示、不计分。')}</p><details><summary>${word('Website evidence available to this comparison','此比较可用的官网证据')}</summary>${input.website_quotes.map(q=>`<div class="evidence"><div class="value">${esc(q.text)}</div>${sourceHTML({url:q.url,source_type:q.source_type,document_type:String(q.verification||'').includes('PARAPHRASE')?'Reviewer paraphrase — not verbatim':'Official business website',document_date:q.document_date,retrieved_at:q.observed_at})}</div>`).join('')}</details></article><p class="notice">${word('Preliminary automated comparisons, not final best-comparable recommendations. Main facets 60%; industry facets 40%. Unknowns are excluded from the observed average; coverage is reported separately.','初步自动比较，不是最终最佳可比推荐。通用facet60%，行业facet40%；未知项不按零分计入平均值，另报证据覆盖率。')}</p>`+rows.map(r=>`<article class="card"><h3>${r['Candidate Order']}. ${esc(r['Candidate Name'])} <small>${esc(r['Candidate RIC'])}</small></h3><p>${esc(r['Candidate Description'])}</p><p class="small">${link(r['Candidate Source URL'],r['Candidate Source'])} · ${esc(r['Candidate Record Locator'])}</p>${String(r.Status||'').startsWith('WITHHELD')?`<p class="notice">${word('Withheld: source-to-company identity must be resolved before scoring.','暂停计分：须先核实来源与公司的对应关系。')}</p>`:''}<div class="metrics"><span><b>${score(r['Similarity Percent'])}</b>${word('Observed-facet similarity /100','已观测项相似度／100')}</span><span><b>${score(r['Evidence Coverage Percent'])}%</b>${word('Weighted evidence coverage','加权证据覆盖率')}</span><span><b>${score(r['Evidence Supported Points'])}</b>${word('Evidence-supported points /100','证据支持分／100')}</span></div><p class="small">${word('Review order: primary-business relevance, then evidence-supported points. Score = Σ(base weight × facet score) / Σ(observed base weight). This index is not a calibrated probability.','复核顺序：核心业务相关性，再看证据支持分。总分＝Σ(基础权重×单项分)／Σ(已观测基础权重)，不是校准概率。')}</p><p class="small">${word('Website-supported comparison module','官网支持的比较模块')}: ${esc(r['Target Industry Module']||'UNKNOWN')}. ${word('This preliminary model uses the primary website-supported module; full multi-segment weighting is not implemented.','本轮初步模型使用官网支持的主要模块，尚未实现完整的多分部加权。')}</p><p class="small">${esc(r['Primary Business Fit Basis']||'')}</p><details><summary>${word('Main facets: evidence, weights and scoring basis','通用facet：证据、权重和评分依据')}</summary>${comparisonTable(r['Facet Details'].filter(x=>x.block==='MAIN'))}</details><details><summary>${word('Industry facets: evidence, weights and scoring basis','行业facet：证据、权重和评分依据')}</summary>${comparisonTable(r['Facet Details'].filter(x=>x.block==='INDUSTRY'))}</details></article>`).join('')}
const INDUSTRY_DICTIONARY={"version":"2026-11-04","source_file":"SIC2_Industry_Facets (83) - Barbara.md","source_sha256":"2c31705f8eaca3e0761c656122584ea3030f5c24f5f8233d9f7547ce13544512","modules":[{"code":"01","title":"Agricultural Production — Crops","scope_url":"https://www.osha.gov/data/sic-manual/major-group-01","scope_notes":"[Official SIC scope](https://www.osha.gov/data/sic-manual/major-group-01)","reference_only":false,"fields":[{"id":"I01-01","name":"Crop / cultivation category","examples":["Corn and soybeans","Apples and citrus","Greenhouse vegetables"]},{"id":"I01-02","name":"Land area by use and tenure","examples":["25,000 cultivated acres","12,000 irrigated acres","8,000 leased acres"]},{"id":"I01-03","name":"Crop-specific yield","examples":["Corn: 180 bushels/acre","Wheat: 3.2 metric tonnes/hectare"]},{"id":"I01-04","name":"Crop calendar","examples":["Single annual crop","Winter wheat–summer soybean rotation","Controlled-environment production"]},{"id":"I01-05","name":"Irrigation system / water dependence","examples":["Rain-fed fields","Center-pivot irrigation","Drip-irrigated orchards"]},{"id":"I01-06","name":"Crop price realization / hedging","examples":["Spot-linked grain sales","Forward-priced harvest contracts","Commodity futures hedges"]},{"id":"I01-07","name":"Harvest frequency","examples":["One grain harvest/year","Two vegetable crops/year","Weekly greenhouse picking"]},{"id":"I01-08","name":"Land / water constraints","examples":["Irrigation-water allocation","Leased-land renewals","Drought-affected acreage"]}]},{"code":"02","title":"Agricultural Production — Livestock and Animal Specialties","scope_url":"https://www.osha.gov/data/sic-manual/major-group-02","scope_notes":"[Official SIC scope](https://www.osha.gov/data/sic-manual/major-group-02)\n\nApply animal and aquaculture rows to the actual production business. SIC 0273 covers animal aquaculture; SIC 09 separately contains fish hatcheries/preserves and species-specific fisheries. Verify t gov/data/sic-manual/major-group-07).","reference_only":false,"fields":[{"id":"I07-01","name":"Agricultural / animal service specialty","examples":["Crop spraying","Livestock veterinary care","Landscape maintenance"]},{"id":"I07-02","name":"Service equipment / crew model","examples":["Custom-harvesting combines","Mobile veterinary teams","Landscaping crews"]},{"id":"I07-03","name":"Seasonal workload","examples":["Spring planting peak","Autumn harvest peak","Recurring lawn-care rounds"]},{"id":"I07-04","name":"Service charging / contract basis","examples":["Fee per sprayed acre","Fee per veterinary visit","Seasonal grounds-maintenance contract"]},{"id":"I07-05","name":"Customer operating scale","examples":["2,000-acre grain farms","Commercial dairy herds","Municipal landscaping portfolios"]}]},{"code":"08","title":"Forestry","scope_url":"https://www.osha.gov/data/sic-manual/major-group-08","scope_notes":"[Official SIC scope](https://www.osha.gov/data/sic-manual/major-group-08)\n\nForestry includes timber tracts, forest nurseries/products and forestry services. Logging contractors that cut timber are SIC 2411, not automatically SIC 08. [Logging boundary](https://www.osha.gov/sic-manual/2411).","reference_only":false,"fields":[{"id":"I08-01","name":"Tree / forest-product species","examples":["Southern pine","Eucalyptus","Mixed hardwoods"]},{"id":"I08-02","name":"Timberland ownership / management role","examples":["Owned timber tracts","Third-party forest management","Forest nursery operator"]},{"id":"I08-03","name":"Silvicultural / rotation cycle","examples":["25-year pine rotation","7-year eucalyptus rotation","Selective hardwood harvesting"]},{"id":"I08-04","name":"Timberland area","examples":["150,000 productive acres","40,000 hectares under management"]},{"id":"I08-05","name":"Regeneration / forest stewardship","examples":["Replanting after harvest","Assisted natural regeneration","Selective thinning"]},{"id":"I08-06","name":"Forest health / climate exposure","examp chery capacity","Stocking agreements with fisheries"]}]},{"code":"10","title":"Metal Mining","scope_url":"https://www.osha.gov/data/sic-manual/major-group-10","scope_notes":"[Official SIC scope](https://www.osha.gov/data/sic-manual/major-group-10)\n\nSeparate mineral resources from economically mineable reserves; neither is interchangeable with throughput or remaining mine life. Grade, recovery and costs must retain commodity-specific units and the issuer’s reporting definition. [SEC mining-disclosure guide](https://www.sec.gov/resources-small-businesses/small-business-compliance-guides/modernization-property-disclosures-mining-registrants-small-entity-compliance-guide).","reference_only":false,"fields":[{"id":"I10-01","name":"Metal / commodity mix","examples":["Copper–gold mine","Iron ore","Nickel–cobalt operation"]},{"id":"I10-02","name":"Reserve / resource classification","examples":["Proven and probable reserves","Measured and indicated resources","Inferred resources"]},{"id":"I10-03","name":"Ore grade by commodity","examples":["0.6% copper","1.8 g/t gold","62% iron content"]},{"id":"I10-04","name":"Remaining mine life","examples":["18 years of reserve-supported production","12-year approved mine plan"]},{"id":"I10-05","name":"Mining method / mine stage","examples":["Operating open pit","Underground stoping","Development-stage project"]},{"id":"I10-06","name":"Metallurgical recovery","examples":["88% copper recovery","92% gold recovery"]},{"id":"I10-07","name":"Ore-processing capacity","examples":["45,000 metric tonnes/day","12 million metric tonnes/year"]},{"id":"I10-08","name":"Mining cost / reporting basis","examples":["Copper C1 cash cost: $1.60/lb","Gold AISC: $1,250/oz"]}]},{"code":"12","title":"Coal Mining","scope_url":"https://www.osha.gov/data/sic-manual/major-group-12","scope_notes":"[Official SIC scope](https://www.osha.gov/data/sic-manual/major-group-12)","reference_only":false,"fields":[{"id":"I12-01","name":"Coal quality","examples":["High-volatile rket mix","examples":["Single-family homes","Multifamily buildings","Commercial buildings"]},{"id":"I15-02","name":"Project / building type","examples":["Logistics warehouses","Office fit-outs","Residential subdivisions"]},{"id":"I15-03","name":"Contracted backlog","examples":["$600 million at year-end","18 months of signed project work"]},{"id":"I15-04","name":"Contract pricing / risk","examples":["Guaranteed maximum price","Fixed-price construction contract","Cost-plus fee"]},{"id":"I15-05","name":"Self-perform / subcontract scope","examples":["Structural work self-performed","Mechanical and electrical work subcontracted"]},{"id":"I15-06","name":"Builder / contractor role","examples":["Fee-based general contractor","Land-owning operative builder","Design–build contractor"]},{"id":"I15-07","name":"Land / inventory exposure [operative builders]","examples":["Owned finished lots","Optioned land parcels","Speculative homes under construction"]}]},{"code":"16","title":"Heavy Construction","scope_url":"https://www.osha.gov/data/sic-manual/major-group-16","scope_notes":"[Official SIC scope](https://www.osha.gov/data/sic-manual/major-group-16)","reference_only":false,"fields":[{"id":"I16-01","name":"Infrastructure project type","examples":["Highway bridges","Water-treatment plants","Marine terminals"]},{"id":"I16-02","name":"Public / private client mix","examples":["State transportation projects","Municipal utility contracts","Private industrial projects"]},{"id":"I16-03","name":"Contracted backlog","examples":["$1.2 billion at quarter-end","24 months of signed work"]},{"id":"I16-04","name":"Heavy-equipment model","examples":["Owned excavation fleet","Leased specialist cranes","Subcontracted tunneling equipment"]},{"id":"I16-05","name":"Project delivery duration","examples":["Two-year bridge contract","Five-year rail program"]},{"id":"I16-06","name":"Fixed-price / cost-overrun exposure","examples":["60% of backlog fixed-price","Cost-plus reimbursable work","Price-escalati ,"scope_url":"https://www.osha.gov/data/sic-manual/major-group-63","scope_notes":"[Official SIC scope](https://www.osha.gov/data/sic-manual/major-group-63)\n\nCombined ratio is an underwriting measure for P&C operations, not a universal life-insurance profitability metric. Preserve gross/net, calendar/accident-year, catastrophe exclusions and the issuer’s expense-ratio basis. Life/annuity and health businesses need liability/benefit measures instead. [NAIC terminology](https://content.naic.org/glossary-insurance-terms?id=37).","reference_only":false,"fields":[{"id":"I63-01","name":"Insurance business line","examples":["Commercial P&C","Life and annuity insurance","Health insurance"]},{"id":"I63-02","name":"Risk underwriting / distribution model","examples":["Direct primary insurer","Reinsurer","Delegated underwriting with retained risk"]},{"id":"I63-03","name":"Premium / exposure mix","examples":["60% commercial auto and 40% property premiums","Individual annuity-led sales"]},{"id":"I63-04","name":"Combined ratio [P&C underwriting]","examples":["Calendar-year combined ratio: 96%","Accident-year ratio excluding catastrophes: 91%, separately defined"]},{"id":"I63-05","name":"Loss / LAE ratio [P&C underwriting]","examples":["Net loss and LAE / net earned premiums: 64%","Accident-year loss and LAE ratio: 60%"]},{"id":"I63-06","name":"Medical benefit ratio [health insurers]","examples":["Medical benefits / premium revenue: 82%","Issuer-defined medical loss ratio: 85%"]},{"id":"I63-07","name":"Reinsurance / catastrophe protection","examples":["Quota-share cessions","Excess-of-loss catastrophe cover","Retained catastrophe limit"]},{"id":"I63-08","name":"Liability duration / guarantees [life and annuity]","examples":["Fixed deferred annuities","Variable annuities with guarantees","Long-duration protection liabilities"]},{"id":"I63-09","name":"Investment / liability matching","examples":["Duration-matched bond portfolio","Interest-rate hedges for annuity guarantees","Separat false,"fields":[{"id":"I65-01","name":"Property / real-estate service type","examples":["Multifamily apartments","Industrial warehouses","Property brokerage"]},{"id":"I65-02","name":"Ownership / operating role","examples":["Direct property owner","Property manager for third parties","Real-estate broker"]},{"id":"I65-03","name":"Occupancy by basis [owners]","examples":["Physical leased-unit occupancy: 95%","Leased-area occupancy: 92%","Economic occupancy: 94%, issuer-defined"]},{"id":"I65-04","name":"Lease term [owners]","examples":["Typical residential lease: 12 months","Rent-weighted unexpired lease term: 6.5 years"]},{"id":"I65-05","name":"Rent by property unit [owners]","examples":["$2,200/unit/month","$25/ft²/year base rent"]},{"id":"I65-06","name":"Property market","examples":["Sun Belt metropolitan areas","Central London offices","Regional industrial corridors"]},{"id":"I65-07","name":"Property-income / fee model","examples":["Rental income and recoveries","Percentage-of-rent management fee","Brokerage commission per transaction"]}]},{"code":"67","title":"Holding & Other Investment Offices","scope_url":"https://www.osha.gov/data/sic-manual/major-group-67","scope_notes":"[Official SIC scope](https://www.osha.gov/data/sic-manual/major-group-67)\n\nDistinguish operating holding companies, investment vehicles, equity REITs and mortgage REITs. Use look-through operating-segment modules for controlled businesses; do not treat fund AUM, NAV and consolidated operating revenue as equivalent scale. Property extensions can be shared with SIC 65 without changing the source’s official code. [REIT scope](https://www.osha.gov/sic-manual/6798).\n\n\n## I. Services","reference_only":false,"fields":[{"id":"I67-01","name":"Holding / investment-office structure","examples":["Operating holding company","Closed-end investment vehicle","Equity REIT"]},{"id":"I67-02","name":"Investment / operating asset mix","examples":["Controlled industrial subsidiaries","Listed securities portfoli ial mortgages","Interest-rate swap hedges"]}]},{"code":"70","title":"Hotels and Other Lodging Places","scope_url":"https://www.osha.gov/data/sic-manual/major-group-70","scope_notes":"[Official SIC scope](https://www.osha.gov/data/sic-manual/major-group-70)\n\nADR is room revenue per room sold; RevPAR is room revenue per available room over the same period. Neither is total hotel revenue per room. Separate owned, managed, franchised and system room populations. [STR/CoStar glossary](https://costar-na-prod.acquia.dshrp.com/products/str-benchmark/resources/glossary).","reference_only":false,"fields":[{"id":"I70-01","name":"Lodging / operating format","examples":["Full-service hotel","Limited-service hotel","Holiday camp"]},{"id":"I70-02","name":"Room inventory / ownership scope","examples":["3,500 owned rooms","20,000 managed rooms","80,000 system rooms"]},{"id":"I70-03","name":"ADR [room operators]","examples":["$175 room revenue/sold room-night","$220 room revenue/sold room-night"]},{"id":"I70-04","name":"RevPAR [room operators]","examples":["$130 room revenue/available room-night","$160 room revenue/available room-night"]},{"id":"I70-05","name":"Room occupancy [room operators]","examples":["Sold room-nights / available room-nights: 74%","Same-property occupancy: 80%"]},{"id":"I70-06","name":"Ownership / management / franchising","examples":["Owned hotels","Third-party managed hotels","Franchised hotel brands"]},{"id":"I70-07","name":"Hotel demand / seasonality","examples":["Summer resort peak","Weekday corporate demand","Conference-led group demand"]},{"id":"I70-08","name":"Brand fee / contract economics [asset-light operators]","examples":["Franchise royalty on hotel room revenue","Base management fee on hotel revenue","Incentive fee on defined hotel profit"]}]},{"code":"72","title":"Personal Services","scope_url":"https://www.osha.gov/data/sic-manual/major-group-72","scope_notes":"[Official SIC scope](https://www.osha.gov/data/sic-manual/major-group-72)","referenc /sic-manual/major-group-76","scope_notes":"[Official SIC scope](https://www.osha.gov/data/sic-manual/major-group-76)","reference_only":false,"fields":[{"id":"I76-01","name":"Repair equipment / product niche","examples":["Industrial pumps","Consumer appliances","Electrical motors"]},{"id":"I76-02","name":"Repair technical scope","examples":["Mechanical overhaul","Electronic diagnostics","Component-level replacement"]},{"id":"I76-03","name":"Warranty / customer-pay mix","examples":["Manufacturer warranty repairs","Customer-paid repairs","Third-party warranty administration"]},{"id":"I76-04","name":"Replacement-parts requirement","examples":["OEM seals and bearings","Refurbished components","Proprietary diagnostic parts"]},{"id":"I76-05","name":"Service-contract coverage","examples":["40% of customer equipment under maintenance agreements","Break-fix jobs only"]}]},{"code":"78","title":"Motion Pictures","scope_url":"https://www.osha.gov/data/sic-manual/major-group-78","scope_notes":"[Official SIC scope](https://www.osha.gov/data/sic-manual/major-group-78)\n\nA production company, content distributor and cinema exhibitor are not direct peers solely because they share SIC 78. Content rights and production budgets do not substitute for cinema screens or admissions.","reference_only":false,"fields":[{"id":"I78-01","name":"Film / video value-chain role","examples":["Film production","Content distribution","Cinema exhibition"]},{"id":"I78-02","name":"Content-library rights","examples":["200 owned film titles","Licensed distribution catalogue","No owned content library"]},{"id":"I78-03","name":"Licensed-rights scope","examples":["Territorial rights","Five-year streaming window","Exclusive theatrical rights"]},{"id":"I78-04","name":"Revenue / release window","examples":["Theatrical box office","Streaming-license fees","Cinema ticket and concession sales"]},{"id":"I78-05","name":"Project / acquisition commitment [producers/distributors]","examples":["$30 million production budg const INDUSTRY_BY_CODE=new Map(INDUSTRY_DICTIONARY.modules.map(m=>[m.code,m]));
const industryNorm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function segmentStandardCodes(s){
 if(!s.source||!s.industry||/unknown|needs review/i.test(s.industry))return [];
 const t=s.industry;const codes=[];
 // Narrow activity labels only. Broad manufacturing/consumer/healthcare labels remain unresolved.
 for(const [rx,code] of [[/restaurant|restaurant franchising/i,'58'],[/property leasing|property.*subleasing|real estate rental|real estate.*development/i,'65'],[/software|IT Services & Consulting/i,'73'],[/insurance|reinsurance/i,'63'],[/asset.*management|wealth management|investment management/i,'62'],[/semiconductor/i,'36'],[/pharmaceutical/i,'28'],[/rail transportation/i,'40'],[/air transport|airline/i,'45'],[/food processing|food.*snacks|^beverages$/i,'20']])if(rx.test(t)&&!(code==='58'&&/property|real estate/i.test(t)))codes.push(code);
 return [...new Set(codes)];
}
function industryStandardPlans(p,c){const plans=[];const primary=c?.primary_sic;
 if(primary&&/(?:SEC SIC|Compustat SIC|US[_ .-]?SIC|U\.S\..*SIC)/i.test(primary.system||'')&&/^\d{2}(?:\d{2})?$/.test(String(primary.code))){const code=String(primary.code).slice(0,2);if(INDUSTRY_BY_CODE.has(code))plans.push({key:'issuer',label:word('Company-wide research','公司整体研究'),scope:'COMPANY',codes:[code],source:primary.source,basis:word('Issuer SIC prefix selects a research checklist; it does not establish every segment’s industry or the applicability of every field.','公司SIC前两位选择研究清单；不代表每个分部都属此行业，也不代表所有字段均适用。')});}
 for(const [i,s] of (c?.segments||[]).entries())plans.push({key:'segment_'+i,label:s.name,scope:'SEGMENT',codes:segmentStandardCodes(s),source:s.source,segment:s,basis:word('Proposed checklist from the retained source-linked activity mapping; not an official segment SIC. Field applicability still requires evidence.','根据已有带来源的业务活动映射提出清单；不是官方分部SIC，字段适用性仍需证据。')});
 return plans;
}
function industryExisting(p,plan){if(plan.scope==='COMPANY')return p.industry_facets||[];const rows=(plan.segment?.segment_facets||[]).map(f=>({...f,name:f.name,segment_text:f.text,segment_source:f.source,evidence_ids:[]}));for(const f of p.audited_wendy_segment_profile?.facets||[]){if(f['Segment Name']!==plan.label||f['Value Text']==null||!f['Verbatim Source Excerpt'])continue;rows.push({name:f.Facet,segment_text:f['Verbatim Source Excerpt'],segment_source:{url:f['Excerpt Source Link'],source_type:'SEC',document_type:f['Excerpt Document'],document_date:f['Excerpt Filing Date'],report_period:f['Excerpt Fact Period'],record_locator:f['Excerpt Section']},evidence_ids:[],scope_note:f['Scope Review']||''});}return rows;}
const INDUSTRY_FIELD_EQUIVALENTS={'I58-01':['Restaurant format'],'I58-02':['Franchise versus Company-operated Mix'],'I58-07':['Product Category'],'I65-01':['Property / Asset Type'],'I65-02':['Ownership / Operating Role'],'I65-04':['Remaining Tenant Lease Term / WALE']};
function matchesIndustryField(h,f){return industryNorm(h.name)===industryNorm(f.name)||(INDUSTRY_FIELD_EQUIVALENTS[f.id]||[]).some(n=>industryNorm(n)===industryNorm(h.name));}
function industryStandardField(f,p,existing){
 // Name equivalence is deliberately narrow; text is not reassigned by embedding/keyword resemblance.
 const hits=existing.filter(x=>matchesIndustryField(x,f));
 return `<article class="card"><h3><span class="badge">${esc(f.id)}</span> ${esc(f.name)}</h3>${hits.length?`<p class="small">${word('Retained evidence mapped from','保留证据对应原字段')}: ${esc(hits.map(h=>h.name).join(' · '))}. ${word('Original source and scope apply; migration is not fresh fact verification.','沿用原来源和范围；迁移不代表完成新的事实验证。')}</p>`:''}${hits.length?hits.map(h=>h.segment_text?`<div class="value">${esc(h.segment_text)}</div>${sourceHTML(h.segment_source)}${h.scope_note?`<p class="small">${esc(h.scope_note)}</p>`:''}`:fieldHTML(h,p)).join(''):`<p class="small">${word('UNKNOWN — no evidence assigned to this standard field yet. Existing related fields remain below for review.','未知：尚无证据明确对应此标准字段；已有相关字段保留在下方供复核。')}</p>`}<details><summary>${word('Illustrative values — not company facts','示例值——不是本公司事实')}</summary><p>${f.examples.map(esc).join(' · ')}</p></details></article>`;
}
function renderStandardIndustry(p,c,chosen=''){
 const plans=industryStandardPlans(p,c);const plan=plans.find(x=>x.key===chosen)||plans[0]||{key:'unresolved',label:word('Industry unresolved','行业未确认'),scope:'COMPANY',codes:[],basis:''};
 const existing=industryExisting(p,plan);const modules=plan.codes.map(code=>INDUSTRY_BY_CODE.get(code));
 let html=`<h2>${word('Industry-specific facets · SIC dictionary standard','行业专属facet · SIC词典标准')}</h2><p>${word('83 SIC2 modules · 546 fields across the dictionary. Only selected checklists are shown; illustrative examples are never company evidence.','词典共83类SIC2、546项字段。仅展示所选行业清单；示例绝不作为公司事实。')}</p><p><a href="SIC2_Industry_Facets_Refined.md" download>${word('Download industry facet dictionary (.md)','下载行业facet词典（.md）')}</a></p><label for="industryScope">${word('Research scope / business segment','研究范围／业务分部')}</label> <select id="industryScope">${plans.length?plans.map(x=>`<option value="${esc(x.key)}" ${x.key===plan.key?'selected':''}>${esc(x.label)}</option>`).join(''):`<option value="unresolved">${esc(plan.label)}</option>`}</select><p class="small">${esc(plan.basis)}</p>${sourceHTML(plan.source)}<p class="small">${word('Full public research only. Restricted Public Comps inputs and historical similarity scores are unchanged.','仅用于完整公开研究；Public Comps的受限输入及历史相似度分数未改变。')}</p>`;
 if(!modules.length)html+=`<p class="notice">${word('Industry checklist unresolved: available classification/activity information is not specific enough for automatic routing. Existing evidence is retained below.','行业清单待确认：现有分类／活动信息不足以自动对应，已有证据保留在下方。')}</p>`;
 for(const m of modules){const base=m.fields.filter(f=>!f.name.includes('[')),conditional=m.fields.filter(f=>f.name.includes('['));html+=`<section><h3>SIC ${esc(m.code)} — ${esc(m.title)}</h3><p>${link(m.scope_url,word('Official SIC scope','官方SIC范围'))}</p>${m.reference_only?`<p class="notice">${word('Reference/classification review entry; not automatic public-comparable eligibility.','仅用于分类参考／复核，不自动视为合格公开可比公司。')}</p>`:''}<details><summary>${word('Industry scope and applicability guidance','行业范围与适用性说明')}</summary><div class="value">${esc(m.scope_notes)}</div></details><p class="small">${word('Checklist fields require activity-level applicability review. Missing evidence does not mean not applicable.','清单字段需按实际活动复核适用性；缺少证据不代表不适用。')}</p>${base.map(f=>industryStandardField(f,p,existing)).join('')}${conditional.length?`<details><summary>${word('Conditional activity extensions — select only applicable subtypes','条件扩展——仅使用适用的细分业务')} (${conditional.length})</summary>${conditional.map(f=>industryStandardField(f,p,existing)).join('')}</details>`:''}</section>`;}
 html+=`<h3>${word('Retained detailed fields and source evidence','保留的细化字段与来源证据')}</h3><p class="small">${word('These fields retain their original names and scope. They are extensions or mapping-review items; they have not been silently relabeled as standard fields.','这些字段保留原名和范围，作为扩展项或映射待复核项；没有静默改名为标准字段。')}</p>`;
 html+=existing.length?existing.map(f=>f.segment_text?`<article class="card"><h4>${esc(f.name)}</h4><div class="value">${esc(f.segment_text)}</div>${sourceHTML(f.segment_source)}</article>`:fieldHTML(f,p)).join(''):`<p>${word('No separately scoped evidence collected yet.','暂无单独对应此范围的证据。')}</p>`;
 if(plan.segment)html+=segmentEvidenceHTML(plan.segment);
 return {html,plans,plan};
}
async function showIndustry(){const p=state.profile,request=state.request;$('content').innerHTML=`<p>${word('Loading industry classifications…','读取行业分类…')}</p>`;const c=await classificationFor(p);if(request!==state.request||state.tab!=='industry')return;function paint(chosen){const x=renderStandardIndustry(p,c,chosen);$('content').innerHTML=(c?classificationHTML(c,p):'')+x.html+(p.audited_wendy_segment_profile?`<button id="showAuditedSegments">${word('View Wendy’s detailed segment evidence','查看Wendy’s细化分部证据')}</button>`:'');$('industryScope').onchange=e=>paint(e.target.value);if(p.audited_wendy_segment_profile)$('showAuditedSegments').onclick=showWendySegmentFields;const total=x.plan.codes.reduce((n,code)=>n+INDUSTRY_BY_CODE.get(code).fields.length,0);const filled=x.plan.codes.reduce((n,code)=>n+INDUSTRY_BY_CODE.get(code).fields.filter(f=>industryExisting(p,x.plan).some(h=>matchesIndustryField(h,f)&&(h.evidence_ids?.length||h.segment_text))).length,0);const span=$('companyTitle').querySelectorAll('.metrics span')[1];if(span)span.innerHTML=`<b>${filled}/${total}</b>${word('Standard industry fields assigned evidence (selected scope)','所选范围已有证据的标准行业字段')}`;}paint('');}

(async()=>{const data=await read('research_catalog');state.companies=data.companies;state.groups=data.groups;state.aliases=data.aliases;const params=new URLSearchParams(location.search);state.tab=params.get('view')||'comps';if(!['comps','facets','industry','segments','sources'].includes(state.tab))state.tab='facets';const requested=params.get('company')||'IQ23557';const key=state.aliases[requested]||state.companies[0]?.key;const company=state.companies.find(c=>c.key===key);$('companySearch').value=company?.name||'';$('role').value=company?.is_original_target?'TARGET':'PUBLIC';await choose(key)})().catch(e=>$('content').innerHTML='<p class="notice">'+esc(e.message)+'</p>');

</script></body></html>
